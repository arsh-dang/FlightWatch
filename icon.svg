<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Flight fare watcher" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Fare watch</title>

  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="114" ry="114"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">

    <rect width="512" height="512" fill="#131A2B"/>

    <!-- contrail: flat, then falling away, like a fare dropping -->
    <g stroke="#E4B363" stroke-linecap="round" fill="none">
      <path d="M 92 126 L 122 126" stroke-width="26" opacity="0.5"/>
      <path d="M 172 130 C 232 142 240 208 272 248" stroke-width="26"/>
    </g>

    <!-- jet, nose down into the descent -->
    <g transform="translate(330,310) rotate(135) scale(10) translate(-12,-12)">
      <path fill="#F5F3EE" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
    </g>

  </g>
</svg>
