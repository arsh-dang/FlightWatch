name: Flight watch

on:
  schedule:
    # 08:13 and 20:13 Melbourne (AEST). Deliberately off the hour: GitHub
    # queues scheduled jobs at lowest priority and the :00 slots are the most
    # congested, so on-the-hour runs get delayed or dropped outright.
    - cron: '13 10,22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: flight-watch
  cancel-in-progress: false

jobs:
  run-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install requests

      - name: Run flight watch
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Repo variables (Settings → Secrets and variables → Actions →
          # Variables). Unset resolves to "", which falls back to the defaults.
          ROUTES: ${{ vars.ROUTES }}
          SEARCH_BUDGET: ${{ vars.SEARCH_BUDGET }}
        run: |
          python3 spontaneous_watch.py

      - name: Build dashboard
        run: python3 build_dashboard.py

      - name: Commit state and dashboard if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json history.json catalogue.json docs/index.html || true
          if ! git diff --staged --quiet; then
            git commit -m "Update fare data and dashboard"
            git pull --rebase
            git push
          else
            echo "No state change"
          fi
