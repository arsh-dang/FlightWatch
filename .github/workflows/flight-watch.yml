name: Flight watch

on:
  schedule:
    # Twice daily (UTC). Adjust cron as you prefer.
    - cron: '0 6,18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: flight-watch
  cancel-in-progress: false

jobs:
  run-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install requests

      - name: Run flight watch
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python3 spontaneous_watch.py

      - name: Build dashboard
        run: python3 build_dashboard.py

      - name: Commit state and dashboard if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json history.json docs/index.html || true
          if ! git diff --staged --quiet; then
            git commit -m "Update fare data and dashboard"
            git pull --rebase
            git push
          else
            echo "No state change"
          fi
